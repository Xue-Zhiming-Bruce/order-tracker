receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  # Metrics: expose an endpoint for Prometheus to SCRAPE (Prometheus pulls).
  prometheus:
    endpoint: 0.0.0.0:8889
  # Logs: Loki 3.x accepts OTLP natively.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  # Traces: Tempo receives OTLP directly.
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki]
